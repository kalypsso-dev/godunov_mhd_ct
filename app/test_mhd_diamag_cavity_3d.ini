#
# test user case CRRES G-10
#
#

[run]
dimension=3
tEnd=1e-8
nStepmax=10000

# noutput equals -1 means we dump data at every time steps
nOutput=1

[amr]
level_min=2
level_max=4

use_block_data=yes
bx=8
by=8
bz=8

# amr refine criterion use at init condition
# possible value: ALWAYS_REFINE, GEOMETRIC, SAME_AS_REGULAR_DYNAMICS
refine_criterion_at_init=GEOMETRIC

# time_integrator
time_integrator=HANCOCK

# init step may contain calls to globalRefine
# if the following option is true, we interleave
# calls to load balancing in between globalRefine
# if the following option is false, a single load
# balancing operation is done at the end of
# globalRefine steps
enable_load_balance_during_init=false

# refine criterion (used during regular dynamics)
# example parameter for using LOHNER_UNSPLIT criterion
refine_criterion=LOHNER_UNSPLIT
epsilon_refine=0.16
epsilon_coarsen=0.02
epsilon_lohner=0.02

# example parameter for using LOHNER_UNSPLIT criterion
#refine_criterion=SIMPLE_GRADIENT
#epsilon_refine=0.1
#epsilon_coarsen=0.01

# p4est connectivity type
connectivity=brick

# control MPI load balancing (number of time steps between two
# consecutive load balancing)
load_balancing_frequency=10

# control AMR cycle frequency (number of time steps between two
# consecutive AMR cycles)
cycle_frequency=5

#
# when using two AMR refinement criterion (one for init conditions,
# one of the rest of the simulation run), we may want to disable the first amr cycle
# to smooth the transition between the two AMR criterion.
#
disable_first_amr_cycle=yes

#
# prolongation operator used when extrapolating from coarse to fine cell
#
cell_centered_prolongation_type=SIMPLE_COPY
#cell_centered_prolongation_type=EXTRAPOLATE_LINEAR_MINMOD

#
# number of octants per computing group (only useful when using implementation 1 or 2)
# larger values improve performance but increase memory footprint
#nbOctsPerGroup=128

[p4est_connectivity]
nbrick_x=1
nbrick_y=1
nbrick_z=1

periodic_x=1
periodic_y=1
periodic_z=1

[mesh]
xmin=0
ymin=0
zmin=0

scaling_factor=1.0

boundary_type_xmin=WALL
boundary_type_xmax=WALL

boundary_type_ymin=WALL
boundary_type_ymax=WALL

boundary_type_zmin=WALL
boundary_type_zmax=WALL

[hydro]
gamma0=1.666
cfl=0.8
niter_riemann=10
iorder=2
slope_type=2
problem=cavity
riemann=HLLD
implementation_version=0
abort_when_negative_eint=false

[cavity]
# init_type :
# 1) time_init   : t0 and Vmax are defined by the user and rmax is calculated as : rmax = t0*Vmax
# 2) radius_init : rmax and Vmax are defined by the user ans t0 is calculated as : t0 = rmax/Vmax
#init_type=radius_init
# Physical starting time [s]
t0=2e-7
# radius max
#rmax= 0.02
# Minimal Value of the initial debris velocity [m/s]
Vmin=0
# Maximal value of the initial debris Velocity [m/s]
Vmax=260e3
# Debris molar mass  [kg/mol]
# default value is Carbon
M_d=0.012011
# Debris ion number [#]
N_d=1.5608816704478538e+18
# Debris initial temperature equivalent to Ti 1eV=11604K [K]
T_d=11604
# Debris profile
rho_profile=base
# shape : cylinder / sphere
shape=spherical
# if shape = cylinder, zmin_cylinder and zmax_cylinder are the position of the top and bottom of the cylinder
# zmin_cylinder
#zmin_cylinder=0.1
# zmax_cylinder
#zmax_cylinder=0.15

# Ambient molar mass [kg/mol]
# default value is Hydrogen
M_a=1.008e-3
# Ambient ion density [#/m^(-3)]
n_a=5e18

# Ambient amplitude of magnetic field [T]
B0=0.02
# Default B orientation is along z-axis
# bx = 0
# by = 0
# bz = B0/sqrt(mu0)

#perturbation
perturb=false
amplitude_perturb=0.0025
wave_number=15

[correction_powell]
enabled=true

[output]
outputDir=./
outputPrefix=test_mhd_cavity_2d
outputVtkAscii=false
write_variables=rho,rho_vx,rho_vy,e_tot,Bx,By,Bz,thermal_pressure,divB
write_mesh_info=yes
write_iOct=no
hdf5_enabled=yes
enable_writing_leaf_data=no
write_conformal_status=no
