#
# test case parameters taken from
# An unsplit Godunov method for ideal MHD via constrained transport in three dimensions
# T. A. Gardiner and J. M. Stone
# Journal of Computational Physics, Volume 227, Issue 8, 2008, Pages 4123-4141, ISSN 0021-9991,
# https://doi.org/10.1016/j.jcp.2007.12.017.

[run]
dimension=2
tEnd=0.02
nStepmax=8000

# noutput equals -1 means we dump data at every time steps
nOutput=10

[amr]
level_min=2
level_max=8

use_block_data=yes
bx=8
by=8

# amr refine criterion use at init condition
# possible value: ALWAYS_REFINE, GEOMETRIC, SAME_AS_REGULAR_DYNAMICS
refine_criterion_at_init=GEOMETRIC

# init step may contain calls to globalRefine
# if the following option is true, we interleave
# calls to load balancing in between globalRefine
# if the following option is false, a single load
# balancing operation is done at the end of
# globalRefine steps
enable_load_balance_during_init=false

# refine criterion (used during regular dynamics)
# example parameter for using LOHNER_UNSPLIT criterion
refine_criterion=LOHNER_UNSPLIT
epsilon_refine=0.20
epsilon_coarsen=0.025
epsilon_lohner=0.02

# example parameter for using LOHNER_UNSPLIT criterion
#refine_criterion=SIMPLE_GRADIENT
#epsilon_refine=0.1
#epsilon_coarsen=0.01

# p4est connectivity type
connectivity=brick

# control MPI load balancing (number of time steps between two
# consecutive load balancing)
load_balancing_frequency=10

# control AMR cycle frequency (number of time steps between two
# consecutive AMR cycles)
cycle_frequency=10

#
# when using two AMR refinement criterion (one for init conditions,
# one of the rest of the simulation run), we may want to disable the first amr cycle
# to smooth the transition between the two AMR criterion.
#
disable_first_amr_cycle=yes

#
# prolongation operator used when extrapolating from coarse to fine cell
#
cell_centered_prolongation_type=SIMPLE_COPY
#cell_centered_prolongation_type=EXTRAPOLATE_LINEAR_MINMOD
#cell_centered_prolongation_type=CONSERVATIVE_INTERPOLATION_ORDER_2

#
# number of octants per computing group (only useful when using implementation 1 or 2)
# larger values improve performance but increase memory footprint
#nbOctsPerGroup=128

[p4est_connectivity]
nbrick_x=1
nbrick_y=1

periodic_x=1
periodic_y=1

[mesh]
xmin=-0.5
ymin=-0.5

scaling_factor=1.0

boundary_type_xmin=ZERO_GRADIENT
boundary_type_xmax=ZERO_GRADIENT

boundary_type_ymin=ZERO_GRADIENT
boundary_type_ymax=ZERO_GRADIENT

[hydro]
gamma0=1.666
cfl=0.5
niter_riemann=10
slope_type=1
problem=blast
riemann=HLLD
implementation_version=0
abort_when_negative_eint=yes
smallr=1e-8

[blast]
density_in=1.0
density_out=1.0
pressure_in=100.0
pressure_out=1.0
radius=0.125

# here we use bx = by = 10/sqrt(2)
bx=7.071067811865475
by=7.071067811865475
bz=0.0

[output]
outputDir=./
outputPrefix=test_mhd_blast_2d_stone_gardiner_2008
outputVtkAscii=false
write_variables=rho,rho_vx,rho_vy,e_tot,Bx,By,Bz,thermal_pressure,magnetic_pressure,divB,specific_ekin
write_mesh_info=yes
write_iOct=no
hdf5_enabled=yes
enable_writing_leaf_data=no
write_conformal_status=no
